<!doctype html>
<meta charset="utf-8">
<!-- Сборка screens.png: компьютер и телефон, светлая и тёмная тема. Снимок 1600 px шириной. -->
<style>
html,body{margin:0;background:#fff}
.grid{display:grid;grid-template-columns:1fr auto;gap:24px;padding:24px;width:1552px}
.desk,.phone{border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12);line-height:0}
.desk img{width:100%;display:block}
.phone{height:741px}
.phone img{height:741px;display:block}
</style>
<div class="grid">
  <div class="desk"><img src="today-light.png"></div>
  <div class="phone"><img src="phone-today.png"></div>
  <div class="desk"><img src="calendar-week.png"></div>
  <div class="phone"><img src="phone-upcoming-dark.png"></div>
</div>
