# Пример установки. Запуск: docker compose up -d
# Сервер слушает 8080 только на 127.0.0.1; снаружи его закрывает HTTPS-прокси (Caddy, nginx, Traefik).
services:
  dela:
    image: ghcr.io/olerast67/dela:0.2.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - dela-data:/data
    environment:
      # Первым (администратором) может зарегистрироваться только этот адрес. Впишите свой.
      DELA_ADMIN_EMAIL: ''
      # Регистрация после администратора только по приглашениям; true открывает её всем.
      DELA_OPEN_REGISTRATION: 'false'
      # Сервер стоит за прокси: адрес клиента для лимитов попыток берётся из X-Forwarded-For.
      DELA_TRUST_PROXY: 'true'
      # Сколько ежедневных снимков базы хранить в /data/backups.
      DELA_BACKUP_KEEP: '7'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  dela-data:
