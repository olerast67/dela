[package]
name = "dela-desktop"
version = "0.8.0"
description = "Dela, a task manager with end-to-end encryption"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
# deep-link: второй запуск по ссылке dela:// передаёт её в работающее окно
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# запуск при входе в Windows: ключ в реестре HKCU...Run с аргументом --minimized
tauri-plugin-autostart = "2.7.0"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
