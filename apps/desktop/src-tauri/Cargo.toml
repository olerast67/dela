[package]
name = "dela-desktop"
version = "1.0.0"
description = "Dela, a task manager with end-to-end encryption"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
# сверка DLL sherpa-onnx по SHA-256
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
# deep-link: второй запуск по ссылке dela:// передаёт её в работающее окно
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# запуск при входе в Windows: ключ в реестре HKCU...Run с аргументом --minimized
tauri-plugin-autostart = "2.7.0"
serde_json = "1"
# подписки на календари iCal: запрос без ограничений CORS, только https; тот же reqwest, что у обновлений
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# голосовой ввод без облака: официальные биндинги sherpa-onnx (DLL из выпуска v1.13.8, хэши сверяет build.rs),
# запись с микрофона через WASAPI, проверка скачанных моделей по SHA-256
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
cpal = "0.18"
sha2 = "0.10"
libloading = "0.7"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
