version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @hono/node-ws 1.x требует @hono/node-server 1.x; вторую версию берём, когда выйдет совместимый node-ws.
      - dependency-name: '@hono/node-server'
        update-types: ['version-update:semver-major']
    groups:
      dev:
        dependency-type: development
      prod:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Сервер держится на LTS-версии Node: нечётные и ещё не LTS выпуски не предлагать.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /apps/mobile/android
    schedule:
      interval: monthly
    ignore:
      # Gradle 9.6+ не работает с Android Gradle Plugin 8, на котором собраны Capacitor 8 и его плагины.
      - dependency-name: gradle-wrapper
        update-types: ['version-update:semver-major']
