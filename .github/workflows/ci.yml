name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  # Часы: ядро из packages/core собирается для QuickJS и проверяется на JVM вместе с мостом на Kotlin
  # (вход и выполнение — против сервера Dela в этом же задании), экраны рисуются в Robolectric.
  wear:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - name: Start a test server and seed an account
        run: |
          DELA_DB_PATH=:memory: DELA_OPEN_REGISTRATION=true DELA_PORT=8795 DELA_HOST=127.0.0.1 npm run server > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8795/api/health && break; sleep 1; done
          node apps/wear/scripts/dev-seed.ts seed http://127.0.0.1:8795 watch@example.com 'пароль часов'
      - name: Test and build
        working-directory: apps/wear
        env:
          DELA_WEAR_TEST_SERVER: http://127.0.0.1:8795
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

  # Образ выпуска по тегу собирает release.yml вместе с подписанным списком файлов веб-версии.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ветка main публикует edge и образ по коммиту.
      - id: tags
        env:
          REPO: ${{ github.repository }}
        run: |
          {
            echo 'list<<EOF'
            echo "ghcr.io/$REPO:$GITHUB_SHA"
            echo "ghcr.io/$REPO:edge"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # Образ публикуется без общего кэша сборки: отравленный кэш не попадёт в выпуск.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
      - name: Smoke test
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          docker run -d --name dela -p 127.0.0.1:8080:8080 "$IMAGE"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker logs dela
